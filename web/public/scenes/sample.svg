    <path d="m-56-8 27-12 80 8 8 9-31 15-68-5Z" fill="#579991" stroke="#3f817f" stroke-width="2"/><path d="m-48-7 21-6 71 6" fill="none" stroke="#91bdb0" stroke-width="4"/><path d="m-38 5 63 4" stroke="#427f7a" stroke-width="2"/>
  </g>
