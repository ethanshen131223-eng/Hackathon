  <g transform="translate(920 440) rotate(17)" filter="url(#shadow)">
    <path d="m-61-27 33-23 24 14 39-3 22 34-11 24 14 14-48 22-26-15-33 4-3-34Z" fill="url(#film)" stroke="#97b4b0" stroke-width="2"/>
