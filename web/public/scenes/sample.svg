  </g>
  <!-- Unlabelled reticle communicates magnification without claiming a calibration. -->
  <g transform="translate(1074 633)" stroke="#558b91" stroke-width="2" opacity=".7"><path d="M-19 0h38M0-19v38"/><circle r="9" fill="none"/></g>
</svg>
