<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">A closer look — illustrated training sample</title>
  <desc id="desc">A stylized magnified sample on a glass dish, containing seven colored or patterned objects. All identities and measurements are authored for learning; this is not microscopy data.</desc>
  <defs>
    <linearGradient id="table" x2="1" y2="1"><stop stop-color="#c9dfdc"/><stop offset="1" stop-color="#a6cdcb"/></linearGradient>
    <radialGradient id="sample"><stop stop-color="#eef4e7"/><stop offset=".7" stop-color="#dfead9"/><stop offset="1" stop-color="#c3dcd1"/></radialGradient>
    <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#6bacc2"/><stop offset="1" stop-color="#367c9c"/></linearGradient>
    <linearGradient id="film" x2="1" y2="1"><stop stop-color="#fffdf0" stop-opacity=".85"/><stop offset="1" stop-color="#acc7c4" stop-opacity=".65"/></linearGradient>
    <radialGradient id="pellet" cx=".3" cy=".25"><stop stop-color="#e8c37e"/><stop offset=".7" stop-color="#c9a36b"/><stop offset="1" stop-color="#a58c66"/></radialGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="3" dy="7" stdDeviation="6" flood-color="#285e64" flood-opacity=".17"/></filter>
    <filter id="dishShadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#245761" flood-opacity=".14"/></filter>
  </defs>
  <path fill="url(#table)" d="M0 0h1200v720H0z"/>
  <g stroke="#7facac" opacity=".1" stroke-width="1"><path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200M120 0v720M240 0v720M360 0v720M480 0v720M600 0v720M720 0v720M840 0v720M960 0v720M1080 0v720"/></g>
  <ellipse cx="600" cy="360" rx="544" ry="323" fill="#e2f0e5" fill-opacity=".6" stroke="#93bcb5" stroke-width="3" filter="url(#dishShadow)"/>
  <ellipse cx="600" cy="360" rx="522" ry="302" fill="url(#sample)" stroke="#f3faf0" stroke-width="8"/>
  <ellipse cx="600" cy="360" rx="512" ry="292" fill="none" stroke="#acc8ba" stroke-width="2"/>
  <path d="M111 292c28-113 155-193 315-215M816 636c140-29 236-101 271-189" fill="none" stroke="#f9fff5" stroke-width="8" opacity=".65" stroke-linecap="round"/>
  <g fill="none" stroke="#f8fff1" stroke-width="2" opacity=".65"><circle cx="244" cy="355" r="8"/><circle cx="914" cy="283" r="11"/><circle cx="488" cy="534" r="6"/><circle cx="815" cy="346" r="5"/><circle cx="405" cy="133" r="5"/><circle cx="1026" cy="375" r="6"/></g>
  <g fill="#a8c0a7" opacity=".4"><circle cx="450" cy="309" r="2"/><circle cx="464" cy="320" r="1.5"/><circle cx="675" cy="420" r="2"/><circle cx="665" cy="433" r="1.5"/><circle cx="854" cy="542" r="2"/><circle cx="855" cy="151" r="2"/><circle cx="320" cy="389" r="1.5"/><circle cx="380" cy="606" r="2"/></g>
  <!-- Authored blue fragment: center (340, 220). -->
