<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Harbor drift — illustrated training scene</title>
  <desc id="desc">An overhead view of a quiet harbor, with a wooden dock, a buoy, and seven objects drifting across blue-green water. An authored illustration, not a photograph.</desc>
  <defs>
    <linearGradient id="water" x2="1" y2="1"><stop stop-color="#366c9a"/><stop offset=".52" stop-color="#328f9d"/><stop offset="1" stop-color="#65b6a7"/></linearGradient>
    <linearGradient id="shallows" x2=".2" y2="1"><stop stop-color="#83c3b2" stop-opacity=".6"/><stop offset="1" stop-color="#d6e0b8" stop-opacity=".08"/></linearGradient>
    <linearGradient id="bottle" x2="1" y2="1"><stop stop-color="#d9eee6" stop-opacity=".85"/><stop offset=".55" stop-color="#a2dbd8" stop-opacity=".8"/><stop offset="1" stop-color="#468d9d" stop-opacity=".95"/></linearGradient>
    <linearGradient id="bag" x2=".7" y2="1"><stop stop-color="#f8f4dc" stop-opacity=".94"/><stop offset="1" stop-color="#b7d5ca" stop-opacity=".88"/></linearGradient>
    <linearGradient id="dock" x2="1" y2="1"><stop stop-color="#ba9871"/><stop offset="1" stop-color="#876e55"/></linearGradient>
    <filter id="shadow" x="-40%" y="-50%" width="180%" height="200%"><feDropShadow dx="2" dy="7" stdDeviation="5" flood-color="#12384d" flood-opacity=".24"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
