<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Among the seagrass — illustrated training scene</title>
  <desc id="desc">An overhead illustration of a shallow estuary with seagrass, sandy channels and seven objects to inspect. This scene is an authored learning exercise.</desc>
