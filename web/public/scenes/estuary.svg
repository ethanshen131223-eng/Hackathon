    <linearGradient id="channel" x2=".9" y2="1"><stop stop-color="#b8ccad"/><stop offset="1" stop-color="#93bdab"/></linearGradient>
    <linearGradient id="sand" x2=".6" y2="1"><stop stop-color="#e6ddbc"/><stop offset="1" stop-color="#c9caa5"/></linearGradient>
    <linearGradient id="bag" x2=".6" y2="1"><stop stop-color="#f8f0d8"/><stop offset="1" stop-color="#b6d1bc"/></linearGradient>
    <linearGradient id="metal" x2="1" y2=".1"><stop stop-color="#829c96"/><stop offset=".35" stop-color="#e0e5cd"/><stop offset=".6" stop-color="#aebbb0"/><stop offset="1" stop-color="#718d89"/></linearGradient>
